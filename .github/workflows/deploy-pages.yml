name: Validate website

# GitHub Pages deployment runs automatically from the main branch
# (Settings → Pages → Deploy from branch). This workflow provides CI
# validation on every push; it does not deploy, so it can never interrupt
# the live site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural verification (CSP, viewport, manifest shape)
        run: |
          node -e "
          const fs=require('fs');
          for(const f of ['index.html','download.html','privacy.html','terms.html','releases.html']){
            const html=fs.readFileSync(f,'utf8');
            if(!html.includes('name=\"viewport\"')) throw new Error(f+': missing viewport');
            if(!html.includes('Content-Security-Policy')) throw new Error(f+': missing CSP');
            if(!html.includes('<main id=\"main\">')) throw new Error(f+': missing main landmark');
          }
          const r=JSON.parse(fs.readFileSync('release.json','utf8'));
          if(r.channel!=='preview') throw new Error('unexpected channel: '+r.channel);
          if(r.signed!==false) throw new Error('preview must be marked unsigned');
          console.log('structural checks passed for 5 pages');
          "
      - name: Release links point at real repositories
        run: |
          node -e "
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const links=[...html.matchAll(/https:\/\/github\.com\/phantomguy282-dev\/[^\"' >]+/g)].map(m=>m[0]);
          const uniq=[...new Set(links)];
          if(!uniq.length) throw new Error('no release links found');
          uniq.forEach(l=>console.log('release link:',l));
          "
      - name: Version manifest sanity
        run: |
          node -e "
          const v=require('./versions.json');
          for(const p of ['desktop','android','ios']){
            if(!v[p] || !v[p].status) throw new Error('missing status for '+p);
            if(v[p].status!=='development' && !v[p].release_url) throw new Error(p+': non-development without release URL');
          }
          console.log('versions manifest OK');
          "
      - name: Live site reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://phantomguy282-dev.github.io/Aster-website/)
          echo "live site HTTP $code"
          test "$code" = "200"
